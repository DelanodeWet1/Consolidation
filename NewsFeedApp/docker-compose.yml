name: newsfeedapp

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      # Compose reads these from your .env file
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside Docker's network the database is reached by its service
      # name, not localhost. This overrides DB_HOST from .env.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Uncomment to edit code live without rebuilding the image:
    # volumes:
    #   - .:/app

volumes:
  db_data:
