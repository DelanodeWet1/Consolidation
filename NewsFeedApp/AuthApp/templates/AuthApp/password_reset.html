{% extends 'base.html' %}
{% block title %}BuyThings - Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bt-card shadow-sm p-4">
            <h2 class="mb-4 text-center">Reset Password</h2>

            {% if error %}
                <div class="alert alert-bt-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'AuthApp:reset_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" name="password" class="form-control" placeholder="New password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" name="password_conf" class="form-control" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-bt-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
