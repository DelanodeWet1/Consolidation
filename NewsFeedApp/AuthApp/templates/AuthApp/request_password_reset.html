{% extends 'base.html' %}
{% block title %}BuyThings - Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bt-card shadow-sm p-4">
            <h2 class="mb-4 text-center">Forgot Password?</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Enter your email address</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-bt-primary w-100">Send Reset Link</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
