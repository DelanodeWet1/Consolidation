{% extends 'base.html' %}
{% block title %}BuyThings - Reset Error{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card bt-card shadow-sm p-4">
            <h2 class="mb-3">Password Reset Error</h2>
            <p>{{ message }}</p>
            <a href="{% url 'AuthApp:request_password_reset' %}" class="btn btn-bt-primary">Request new reset</a>
        </div>
    </div>
</div>
{% endblock %}
